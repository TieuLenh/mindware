name: microservices-backend-stack

x-common-service: &common-service
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-healthcheck: &default-hc
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 15s

networks:
  edge_net:
    driver: bridge
  app_net:
    driver: bridge
  data_net:
    driver: bridge
    internal: true

volumes:
  auth_db_data:
  user_db_data:
  order_db_data:
  ms_redis_data:
  ms_rabbitmq_data:

services:
  # =========================================================
  # 1. API GATEWAY (Điểm vào duy nhất cho Client)
  # =========================================================
  api-gateway:
    <<: *common-service
    image: nginx:1.27-alpine
    container_name: ms-api-gateway
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./nginx/api-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge_net
      - app_net
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      <<: *default-hc
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]

  # =========================================================
  # 2. DOMAIN MICROSERVICES (Mỗi service có DB riêng biệt)
  # =========================================================
  auth-service:
    <<: *common-service
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: ms-auth-service
    environment:
      PORT: 8001
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_NAME: auth_db
      DB_USER: ${AUTH_DB_USER:-auth_user}
      DB_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme_redis}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    expose:
      - "8001"
    networks:
      - app_net
      - data_net
    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *default-hc
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8001/health || exit 1"]

  user-service:
    <<: *common-service
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: ms-user-service
    environment:
      PORT: 8002
      DB_HOST: user-db
      DB_PORT: 5432
      DB_NAME: user_db
      DB_USER: ${USER_DB_USER:-user_svc}
      DB_PASSWORD: ${USER_DB_PASSWORD:?Set USER_DB_PASSWORD in .env}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
    expose:
      - "8002"
    networks:
      - app_net
      - data_net
    depends_on:
      user-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      <<: *default-hc
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8002/health || exit 1"]

  order-service:
    <<: *common-service
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: ms-order-service
    environment:
      PORT: 8003
      DB_HOST: order-db
      DB_PORT: 5432
      DB_NAME: order_db
      DB_USER: ${ORDER_DB_USER:-order_svc}
      DB_PASSWORD: ${ORDER_DB_PASSWORD:?Set ORDER_DB_PASSWORD in .env}
      USER_SERVICE_URL: http://user-service:8002
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
    expose:
      - "8003"
    networks:
      - app_net
      - data_net
    depends_on:
      order-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      <<: *default-hc
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8003/health || exit 1"]

  # =========================================================
  # 3. DATABASE-PER-SERVICE & ASYNC BROKER
  # =========================================================
  auth-db:
    <<: *common-service
    image: postgres:16-alpine
    container_name: ms-auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${AUTH_DB_USER:-auth_user}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    networks:
      - data_net
    healthcheck:
      <<: *default-hc
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d auth_db"]

  user-db:
    <<: *common-service
    image: postgres:16-alpine
    container_name: ms-user-db
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: ${USER_DB_USER:-user_svc}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:?Set USER_DB_PASSWORD in .env}
    volumes:
      - user_db_data:/var/lib/postgresql/data
    networks:
      - data_net
    healthcheck:
      <<: *default-hc
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d user_db"]

  order-db:
    <<: *common-service
    image: postgres:16-alpine
    container_name: ms-order-db
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: ${ORDER_DB_USER:-order_svc}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:?Set ORDER_DB_PASSWORD in .env}
    volumes:
      - order_db_data:/var/lib/postgresql/data
    networks:
      - data_net
    healthcheck:
      <<: *default-hc
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d order_db"]

  redis:
    <<: *common-service
    image: redis:7-alpine
    container_name: ms-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-changeme_redis}"]
    volumes:
      - ms_redis_data:/data
    networks:
      - data_net
    healthcheck:
      <<: *default-hc
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_redis}", "ping"]

  rabbitmq:
    <<: *common-service
    image: rabbitmq:3.13-management-alpine
    container_name: ms-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - ms_rabbitmq_data:/var/lib/rabbitmq
    networks:
      - data_net
    healthcheck:
      <<: *default-hc
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
