name: distributed-backend-stack

# Pattern Hệ thống phân tán:
# - Stateless API nodes có thể scale ngang (--scale api-node=3) qua Load Balancer
# - Primary / Read-Replica DB (Read/Write splitting)
# - Distributed Cache (Redis) + Event Streaming (Kafka/Broker) + Background Workers
# - Distributed Tracing & Metrics (OpenTelemetry / Prometheus)

x-common-service: &common-service
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-healthcheck: &default-hc
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 20s

networks:
  edge_net:
    driver: bridge
  mesh_net:
    driver: bridge
  data_net:
    driver: bridge
    internal: true

volumes:
  pg_primary_data:
  pg_replica_data:
  redis_node1_data:
  kafka_data:
  prometheus_data:

services:
  # =========================================================
  # 1. LOAD BALANCER / INGRESS (Cân bằng tải tới các API Nodes)
  # =========================================================
  load-balancer:
    <<: *common-service
    image: nginx:1.27-alpine
    container_name: dist-load-balancer
    ports:
      - "${LB_PORT:-80}:80"
    volumes:
      - ./nginx/load-balancer.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge_net
      - mesh_net
    depends_on:
      api-node:
        condition: service_healthy
    healthcheck:
      <<: *default-hc
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]

  # =========================================================
  # 2. STATELESS API NODES (Scale ngang: docker compose up -d --scale api-node=3)
  # =========================================================
  api-node:
    <<: *common-service
    build:
      context: ./services/api-node
      dockerfile: Dockerfile
    # KHÔNG đặt container_name và KHÔNG map host ports để cho phép scale nhiều replica
    deploy:
      replicas: ${API_REPLICAS:-2}
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    environment:
      PORT: 8080
      NODE_ROLE: api
      DB_WRITE_HOST: pg-primary
      DB_READ_HOST: pg-replica
      DB_PORT: 5432
      DB_NAME: ${DIST_DB_NAME:-distributed_db}
      DB_USER: ${DIST_DB_USER:-dist_user}
      DB_PASSWORD: ${DIST_DB_PASSWORD:?Set DIST_DB_PASSWORD in .env}
      REDIS_HOST: redis-cache
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme_redis}
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    expose:
      - "8080"
    networks:
      - mesh_net
      - data_net
    depends_on:
      pg-primary:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      <<: *default-hc
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health || exit 1"]

  # =========================================================
  # 3. DISTRIBUTED WORKERS (Xử lý bất đồng bộ từ Event Stream)
  # =========================================================
  stream-worker:
    <<: *common-service
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    environment:
      NODE_ROLE: worker
      DB_WRITE_HOST: pg-primary
      DB_PORT: 5432
      DB_NAME: ${DIST_DB_NAME:-distributed_db}
      DB_USER: ${DIST_DB_USER:-dist_user}
      DB_PASSWORD: ${DIST_DB_PASSWORD:?Set DIST_DB_PASSWORD in .env}
      REDIS_HOST: redis-cache
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme_redis}
      KAFKA_BROKERS: kafka:9092
      CONSUMER_GROUP: order-workers-group
    networks:
      - mesh_net
      - data_net
    depends_on:
      pg-primary:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # =========================================================
  # 4. DISTRIBUTED DATA LAYER (Primary/Replica DB + Cache + Kafka)
  # =========================================================
  pg-primary:
    <<: *common-service
    image: postgres:16-alpine
    container_name: dist-pg-primary
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    environment:
      POSTGRES_DB: ${DIST_DB_NAME:-distributed_db}
      POSTGRES_USER: ${DIST_DB_USER:-dist_user}
      POSTGRES_PASSWORD: ${DIST_DB_PASSWORD:?Set DIST_DB_PASSWORD in .env}
    volumes:
      - pg_primary_data:/var/lib/postgresql/data
    networks:
      - data_net
    healthcheck:
      <<: *default-hc
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]

  pg-replica:
    <<: *common-service
    image: postgres:16-alpine
    container_name: dist-pg-replica
    environment:
      POSTGRES_DB: ${DIST_DB_NAME:-distributed_db}
      POSTGRES_USER: ${DIST_DB_USER:-dist_user}
      POSTGRES_PASSWORD: ${DIST_DB_PASSWORD:?Set DIST_DB_PASSWORD in .env}
    volumes:
      - pg_replica_data:/var/lib/postgresql/data
    networks:
      - data_net
    depends_on:
      pg-primary:
        condition: service_healthy
    healthcheck:
      <<: *default-hc
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]

  redis-cache:
    <<: *common-service
    image: redis:7-alpine
    container_name: dist-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-changeme_redis}"]
    volumes:
      - redis_node1_data:/data
    networks:
      - data_net
    healthcheck:
      <<: *default-hc
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_redis}", "ping"]

  # Apache Kafka (KRaft mode - không cần Zookeeper)
  kafka:
    <<: *common-service
    image: apache/kafka:3.8.0
    container_name: dist-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    networks:
      - data_net
    healthcheck:
      <<: *default-hc
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]

  # =========================================================
  # 5. OBSERVABILITY (Metrics / Monitoring cho hệ phân tán)
  # =========================================================
  prometheus:
    <<: *common-service
    image: prom/prometheus:v2.54.1
    container_name: dist-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - mesh_net
      - data_net
