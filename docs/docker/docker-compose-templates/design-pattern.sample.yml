name: platform-stack

# Định nghĩa anchor tái sử dụng cho các service phổ biến
x-common-service: &common-service
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-healthcheck-defaults: &hc-defaults
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 15s

networks:
  edge_net:
    driver: bridge
  app_net:
    driver: bridge
  data_net:
    driver: bridge
    internal: true   # Chặn truy cập trực tiếp ra internet từ mạng dữ liệu

volumes:
  pg_monolith_data:
  pg_auth_data:
  pg_orders_data:
  redis_data:
  broker_data:

services:
  # =========================================================
  # 0. REVERSE PROXY / API GATEWAY (Dùng cho Microservices / Distributed)
  # =========================================================
  gateway:
    <<: *common-service
    image: nginx:1.27-alpine
    profiles: ["microservices", "distributed"]
    ports:
      - "${GATEWAY_PORT:-80}:80"
    networks:
      - edge_net
      - app_net
    depends_on:
      auth-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      <<: *hc-defaults
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]

  # =========================================================
  # 1. MONOLITH PATTERN (1 ứng dụng chính + 1 CSDL)
  # Chạy: docker compose --profile monolith up -d
  # =========================================================
  monolith-db:
    <<: *common-service
    image: postgres:16-alpine
    profiles: ["monolith"]
    environment:
      POSTGRES_DB: ${MONO_DB_NAME:-monolith_db}
      POSTGRES_USER: ${MONO_DB_USER:-app_user}
      POSTGRES_PASSWORD: ${MONO_DB_PASSWORD:?Set MONO_DB_PASSWORD in .env}
    volumes:
      - pg_monolith_data:/var/lib/postgresql/data
    networks:
      - data_net
    healthcheck:
      <<: *hc-defaults
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]

  monolith-app:
    <<: *common-service
    build:
      context: ./services/monolith
      dockerfile: Dockerfile
    profiles: ["monolith"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_HOST: monolith-db
      DB_PORT: 5432
      DB_NAME: ${MONO_DB_NAME:-monolith_db}
      DB_USER: ${MONO_DB_USER:-app_user}
      DB_PASSWORD: ${MONO_DB_PASSWORD}
    ports:
      - "${MONO_PORT:-8080}:8080"
    networks:
      - edge_net
      - app_net
      - data_net
    depends_on:
      monolith-db:
        condition: service_healthy
    healthcheck:
      <<: *hc-defaults
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health || exit 1"]

  # =========================================================
  # 2. MICROSERVICES PATTERN (Tách domain service + DB riêng/cô lập)
  # Chạy: docker compose --profile microservices up -d
  # =========================================================
  auth-db:
    <<: *common-service
    image: postgres:16-alpine
    profiles: ["microservices", "distributed"]
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${AUTH_DB_USER:-auth_user}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}
    volumes:
      - pg_auth_data:/var/lib/postgresql/data
    networks:
      - data_net
    healthcheck:
      <<: *hc-defaults
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d auth_db"]

  auth-service:
    <<: *common-service
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    profiles: ["microservices", "distributed"]
    environment:
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_NAME: auth_db
      DB_USER: ${AUTH_DB_USER:-auth_user}
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
    networks:
      - app_net
      - data_net
    depends_on:
      auth-db:
        condition: service_healthy
    healthcheck:
      <<: *hc-defaults
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8081/health || exit 1"]

  order-db:
    <<: *common-service
    image: postgres:16-alpine
    profiles: ["microservices", "distributed"]
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: ${ORDER_DB_USER:-order_user}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:?Set ORDER_DB_PASSWORD in .env}
    volumes:
      - pg_orders_data:/var/lib/postgresql/data
    networks:
      - data_net
    healthcheck:
      <<: *hc-defaults
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d order_db"]

  order-service:
    <<: *common-service
    build:
      context: ./services/order
      dockerfile: Dockerfile
    profiles: ["microservices", "distributed"]
    environment:
      DB_HOST: order-db
      DB_PORT: 5432
      DB_NAME: order_db
      DB_USER: ${ORDER_DB_USER:-order_user}
      DB_PASSWORD: ${ORDER_DB_PASSWORD}
      REDIS_HOST: redis-cache
      BROKER_HOST: message-broker
    networks:
      - app_net
      - data_net
    depends_on:
      order-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    healthcheck:
      <<: *hc-defaults
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8082/health || exit 1"]

  # =========================================================
  # 3. DISTRIBUTED SYSTEM PATTERN (Cache, Async Broker, Scale/Stateless)
  # Chạy: docker compose --profile distributed up -d --scale worker=3
  # =========================================================
  redis-cache:
    <<: *common-service
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    profiles: ["microservices", "distributed"]
    volumes:
      - redis_data:/data
    networks:
      - data_net
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "redis-cli", "ping"]

  message-broker:
    <<: *common-service
    image: rabbitmq:3.13-management-alpine
    profiles: ["distributed"]
    environment:
      RABBITMQ_DEFAULT_USER: ${BROKER_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${BROKER_PASS:?Set BROKER_PASS in .env}
    volumes:
      - broker_data:/var/lib/rabbitmq
    networks:
      - data_net
    healthcheck:
      <<: *hc-defaults
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]

  worker:
    <<: *common-service
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    profiles: ["distributed"]
    environment:
      REDIS_HOST: redis-cache
      BROKER_HOST: message-broker
    networks:
      - app_net
      - data_net
    depends_on:
      redis-cache:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    # Lưu ý: KHÔNG đặt `ports:` cứng ở service scale nhiều replica để tránh xung đột cổng host